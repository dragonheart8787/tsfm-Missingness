[project]
name = "tsfm-missingness"
version = "0.1.0"
description = "Chronos-2 missingness geometry pilot (TAAI 2026 preregistered pilot)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chronos-forecasting==2.3.1",
    "torch>=2.2,<3",
    "transformers>=4.41,<6",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=16.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["masks", "model", "metrics", "stats", "diagnostics", "runner", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_model: test requires the real Chronos-2 weights (GPU/network); not run on CPU-only build hosts",
]
