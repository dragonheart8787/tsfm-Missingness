# =============================================================================
# Trailing-gap mechanism experiment — FROZEN / PREREGISTERED.
#
# NOT YET EXECUTED. No forecasts have been produced under this configuration.
# Every rule here was fixed before execution; see
# docs/preregistration_trailing_gap_mechanism_v1.md.
#
# This file declares ONLY what is new to this experiment. Every shared
# convention — bootstrap settings, the equivalence band (SESOI), the dataset,
# the model contract, L/H/stride — is READ FROM configs/pilot_config.yaml and
# is never redefined here. configs/pilot_config.yaml is not modified by this
# experiment.
# =============================================================================

meta:
  name: "trailing-gap-mechanism-v1"
  status: "frozen / preregistered — rules fixed before execution. Not yet executed."
  preregistration: "docs/preregistration_trailing_gap_mechanism_v1.md"
  inherits_from: "configs/pilot_config.yaml"
  # What is inherited rather than restated, so it cannot drift:
  inherited_keys:
    - "design.context_length"          # L = 320
    - "design.horizon"                 # H = 96
    - "design.stride"                  # 96
    - "design.expected_origins"        # 178
    - "dataset.*"
    - "model.*"                        # including the pinned revision + patch grid
    - "statistics.bootstrap.*"         # moving-block, 4/8/12, 5000 replicates
    - "decision.no_go.equivalence_band_frac_of_clean_mae"   # the SESOI, +/-3%

design:
  # PREREGISTERED gap lengths. All must be whole multiples of the model's
  # verified patch size; asserted at build time, never assumed.
  gap_lengths: [16, 32, 64, 128]
  # internal_block(g) sits at a FIXED distance for every g, so that exactly one
  # full real patch always separates the block from the forecast boundary
  # regardless of gap length. Holding this constant is the point: it keeps the
  # "boundary intact" arm comparable across g.
  internal_block_distance: 16
  conditions_per_gap: ["trailing_nan", "truncated_long", "internal_block"]
  # 1 clean + 4 gaps x 3 conditions = 13 per origin.
  expected_conditions_per_origin: 13
  # 178 origins x 13 = 2314. Asserted at RUN time, not now.
  expected_total_forecasts: 2314

truncated_long:
  # The corrected design. The naive version (context of L-g, predict H) would
  # have the model forecast [L-g, L-g+H) while the pilot scored [L, L+H) — a
  # g-step timestamp misalignment invalidating every comparison in that arm.
  #
  #   context            = original_context[:L-g]      (real observations, no NaN)
  #   prediction_length  = H + g                        (NOT H)
  #   scored_prediction  = prediction[g : g+H]          (drop the first g steps)
  #   ground truth       = the original, unchanged H-step target
  request_extra_steps: true
  drop_leading_predicted_steps: true
  # H+g must fit in the model's SINGLE-SHOT output. If it does not, Chronos-2
  # falls back to autoregressive unrolling — a different inference regime, and a
  # contract violation under the original pilot's rules. This is a HARD STOP,
  # never a warning to be ignored.
  forbid_autoregressive_unroll: true
  # Passed to the pipeline so the library itself raises instead of warning.
  limit_prediction_length: true

preconditions_for_execution:
  # Documented preconditions. NOT run today.
  reverify_model_contract: true
  reverify_clean_against_original_run: true
  clean_audit_exact_match_note: >-
    Before any new result is trusted, the clean condition must be re-run and
    audited against the original pilot's clean predictions, to catch
    environment drift (model revision, dependency versions, hardware) since
    the original run. The audit is EXACT: every identity field
    ((origin_id, step_index) key sets, forecast timestamps, ground_truth,
    per-origin target_sha256, dataset checksum, model revision, row
    cardinality) and the canonical float32 prediction SHA256 must match
    exactly. There is no numerical tolerance of any kind for any field, and
    none may be introduced after a discrepancy is observed.
  submit_for_independent_review:
    - "executed config"
    - "run manifest"
    - "summary statistics"
  review_note: >-
    The Research Lead cannot recompute values that live only in an uncommitted
    results/ directory. Summaries — not just code — must reach the reviewer.

contrasts:
  # PRIMARY: own Holm family of 4, independent of every prior family.
  - id: "R_16"
    family: "R"
    gap: 16
    label: "R_16 = MAE(trailing_nan(16)) - MAE(truncated_long(16))"
    minuend: {kind: "trailing_nan", g: 16}
    subtrahend: {kind: "truncated_long", g: 16}
  - id: "R_32"
    family: "R"
    gap: 32
    label: "R_32 = MAE(trailing_nan(32)) - MAE(truncated_long(32))"
    minuend: {kind: "trailing_nan", g: 32}
    subtrahend: {kind: "truncated_long", g: 32}
  - id: "R_64"
    family: "R"
    gap: 64
    label: "R_64 = MAE(trailing_nan(64)) - MAE(truncated_long(64))"
    minuend: {kind: "trailing_nan", g: 64}
    subtrahend: {kind: "truncated_long", g: 64}
  - id: "R_128"
    family: "R"
    gap: 128
    label: "R_128 = MAE(trailing_nan(128)) - MAE(truncated_long(128))"
    minuend: {kind: "trailing_nan", g: 128}
    subtrahend: {kind: "truncated_long", g: 128}
  # SECONDARY: own Holm family of 4, independent of R and of every prior family.
  - id: "B_16"
    family: "B"
    gap: 16
    label: "B_16 = MAE(trailing_nan(16)) - MAE(internal_block(16, d=16))"
    kind: "confounded_with_removed_content"
    minuend: {kind: "trailing_nan", g: 16}
    subtrahend: {kind: "internal_block", g: 16}
  - id: "B_32"
    family: "B"
    gap: 32
    label: "B_32 = MAE(trailing_nan(32)) - MAE(internal_block(32, d=16))"
    kind: "confounded_with_removed_content"
    minuend: {kind: "trailing_nan", g: 32}
    subtrahend: {kind: "internal_block", g: 32}
  - id: "B_64"
    family: "B"
    gap: 64
    label: "B_64 = MAE(trailing_nan(64)) - MAE(internal_block(64, d=16))"
    kind: "confounded_with_removed_content"
    minuend: {kind: "trailing_nan", g: 64}
    subtrahend: {kind: "internal_block", g: 64}
  - id: "B_128"
    family: "B"
    gap: 128
    label: "B_128 = MAE(trailing_nan(128)) - MAE(internal_block(128, d=16))"
    kind: "confounded_with_removed_content"
    minuend: {kind: "trailing_nan", g: 128}
    subtrahend: {kind: "internal_block", g: 128}

mechanism_rule:
  # Frozen before GPU execution. rule_version: preregistered-v1.
  status: "frozen — thresholds fixed before any forecast was produced"
  # Governs ONLY the two directional classifications (rules 3-4).
  min_consistent_gaps: 3
  # Governs ONLY family-wise equivalence (rule 2). Equivalence is an
  # INTERSECTION across all four gaps; a 3-of-4 subset is not family-wise
  # equivalence without a separately adjusted procedure.
  equivalence_required_gaps: 4
  # Dose-response: slope of R_g against g, bootstrapped across origins.
  dose_response:
    # x = g / patch_size, i.e. MISSING PATCHES. Equivalent linearity to raw g,
    # but the slope is then per-patch and directly interpretable.
    method: "per_origin_ols_slope_of_R_against_missing_patches"
    # Frozen: the linear trend is primary for the DOSE-RESPONSE SUB-QUESTION
    # only, never primary evidence for the experiment and never an input to the
    # classification. Nonlinearity is a secondary descriptive check. See
    # preregistration section 7.
    primary: "linear_slope"
    secondary_nonlinearity: "quadratic_term_and_per_gap_pattern"
